name: Build and Deploy to Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    # Self-hosted: a single-use runner from gh-runner-broker on the CI host,
    # building through the host's persistent lattice-builder BuildKit.
    runs-on: [self-hosted, lattice-worker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Inject Keyring secrets
        id: keyring
        uses: aidenappl/keyring-actions@v1
        with:
          url: ${{ secrets.KEYRING_URL }}
          access-key-id: ${{ secrets.KEYRING_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.KEYRING_SECRET_ACCESS_KEY }}

      # The host's shared BuildKit, not docker/setup-buildx-action: that races
      # with other runners on the shared Docker daemon. Its local layer cache
      # persists between builds, so there is no gha cache (it fails through a
      # remote builder anyway).
      - name: Use lattice-builder
        run: |
          docker buildx inspect lattice-builder >/dev/null 2>&1 \
            || docker buildx create --name lattice-builder --driver remote tcp://127.0.0.1:1234
          docker buildx inspect lattice-builder

      - name: Login to Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY_URL }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          builder: lattice-builder
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.keyring.outputs.build-args }}
          secrets: ${{ steps.keyring.outputs.build-args }}
          provenance: false

      - name: Deploy to Lattice
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Triggering Lattice deployment..."
          curl -sf -X POST "${{ secrets.LATTICE_DEPLOY_URL }}?container=${{ github.event.repository.name }}&commit=${{ github.sha }}" \
            --max-time 30 \
            -o /dev/null -w "HTTP %{http_code}"
          echo ""
          echo "Container redeployed successfully!"
