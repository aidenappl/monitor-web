name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, lattice-worker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Keyring exports the NEXT_PUBLIC_* build vars to the environment so
      # next build can bake in public config. No registry push.
      - name: Inject Keyring secrets
        uses: aidenappl/keyring-actions@v1
        with:
          url: ${{ secrets.KEYRING_URL }}
          access-key-id: ${{ secrets.KEYRING_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.KEYRING_SECRET_ACCESS_KEY }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Self-hosted runners share ~/.npm; GitHub's cache upload is slow and useless here.
          package-manager-cache: false
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
